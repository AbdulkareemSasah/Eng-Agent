[project]
name = "eng-platform"
version = "0.0.0"
description = "Private incubation workspace root for the Eng-Agent platform (ADR-0028)."
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# Explicit list: a package folder can hold its spec and plan before its pyproject.toml exists,
# and uv refuses a glob that matches a folder without one. Each package's skeleton task adds it here.
members = ["packages/eng-contract", "packages/eng-harness", "packages/structural-codes/core", "tools/eng-dev-gate"]

[dependency-groups]
dev = ["ruff>=0.17.3", "mypy>=2.4.1", "pytest>=9.2.0", "pytest-cov>=7.1.0", "hypothesis>=6.170.14"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["spikes", "design"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "T20", "C4", "PIE", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"
warn_unreachable = true
exclude = ["spikes"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "windows: needs Windows; runs in the Windows CI job",
    "synthetic: runs against a synthetic fake built from tool schemas",
    "recorded: runs against recorded server replies",
    "live: needs a host program; never runs in CI",
]

[tool.coverage.run]
branch = true
