[project]
name = "eng-harness"
version = "0.1.0.dev0"
description = "Harness of the Eng-Agent platform: run engine, journal, ports and workflows (layer 4)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anyio>=4.16,<5",
    "eng-contract",
    "mcp>=2.3,<3",
    "pydantic>=2.14,<3",
    "ruamel-yaml>=0.19,<0.20",
    "structural-codes-aci318-14",
    "structural-codes-core",
    "httpx2>=2.16,<3",
    "keyring>=25.7,<26",
    "pydantic-ai-slim[openai]==2.65.0",

]

# Test-only dependencies of this package (imports rule IM006 of the gate, spec 4.10); the versions follow the
# workspace root's dev group.
[dependency-groups]
dev = ["pytest>=9.2.0", "hypothesis>=6.170.14"]

[project.scripts]
eng-harness = "eng_harness.cli:main"

[tool.uv.sources]
eng-contract = { workspace = true }
structural-codes-core = { workspace = true }
structural-codes-aci318-14 = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "eng_harness"

# Only keys of the gate's allowed set (eng-dev-gate spec 4.12); mypy takes the workspace root's configuration, and the
# gate runs coverage itself with the thresholds of [tool.eng-gate].
[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "T20", "C4", "PIE", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["tests"]  # shared test helpers import as helpers.<module>
markers = [
    "windows: needs Windows; runs in the Windows CI job",
]

[tool.eng-gate]
profile = "harness"
layer = 4
import_names = ["eng_harness"]
public_modules = ["eng_harness", "eng_harness.errors", "eng_harness.servers", "eng_harness.pages", "eng_harness.calc", "eng_harness.calcs", "eng_harness.templates", "eng_harness.basis", "eng_harness.journal", "eng_harness.block", "eng_harness.report", "eng_harness.cli", "eng_harness.kinds", "eng_harness.kinds.calcs", "eng_harness.ports", "eng_harness.ctx", "eng_harness.engine", "eng_harness.decisions", "eng_harness.decisions.types", "eng_harness.decisions.interfaces", "eng_harness.progress", "eng_harness.adapters", "eng_harness.adapters.csi", "eng_harness.kinds.footing", "eng_harness.kinds.edit_cycle", "eng_harness.workflows", "eng_harness.workflows.model_edit_cycle", "eng_harness.doctor", "eng_harness.providers", "eng_harness.calcs.model_fingerprint", "eng_harness.kinds.column_design", "eng_harness.adapters.csi.products"]          # each later task adds the public modules it creates
coverage_line = 85                        # process/05 section 2
coverage_branch = 75
r1_modules = [
  "src/eng_harness/engine/_inflight.py", "src/eng_harness/engine/_hoststate.py",
  "src/eng_harness/engine/_invariants.py", "src/eng_harness/engine/_hostsafety.py",
  "src/eng_harness/engine/_approvals.py", "src/eng_harness/engine/_modes.py",
  "src/eng_harness/engine/_promote.py", "src/eng_harness/engine/_replay.py",
  "src/eng_harness/calcs/**", "src/eng_harness/_calc/**",
  "src/eng_harness/decisions/_cascade.py",
  "src/eng_harness/decisions/_batch.py",
  "src/eng_harness/decisions/_policy.py",
  "src/eng_harness/decisions/_redaction.py",
  "src/eng_harness/decisions/_rules.py",

]
r2_modules = ["src/eng_harness/journal/**", "src/eng_harness/kinds/**", "src/eng_harness/ctx.py", "src/eng_harness/block.py",
              "src/eng_harness/ports.py", "src/eng_harness/errors.py"]
mutation_min = 80                         # required when R1 or R2 globs exist (gate spec section 5)
block_modules = ["src/eng_harness/workflows/**", "src/eng_harness/blocks/**"]
rule_modules = ["src/eng_harness/rules/**"]
calc_modules = ["src/eng_harness/calcs/**"]
windows_tests = ["tests/windows", "tests/perf"]
