# Case file of aci318_14.13_2_7_1.flexure_at_column_face (clause spec §8; plan 0002 T6). Protected test oracle.
# Hand checks repeat the spec's own equations (§4) and are not independent evidence. Tolerances are the spec's §8
# absolute ones (0.001 kN.m on moments, 1e-4 mm on lengths, 1e-6 on ratios and strains), with rel_tol 0 so that the
# absolute tolerance alone applies. The spec's BD-1, BD-3 and BD-4 hold several inputs each; they are split into .a,
# .b and .c here. BD-2.b to BD-2.f (the eps_tc limit, the Y direction alone, d_x != d_y, the upper beta1 row)
# extend the spec's BD-2 row.
format: structural-codes-verification/1
check_id: aci318_14.13_2_7_1.flexure_at_column_face
cases:
  - id: HC-1
    kind: hand_check
    source: {derivation: "clause spec §4 steps 1 to 9, common inputs of §8"}
    subject: {kind: footing, id: F1}
    inputs: &common
      FX_kN: 0
      FY_kN: 0
      FZ_kN: 1700
      MX_kNm: 0
      MY_kNm: 0
      Lx_mm: 2500
      Ly_mm: 2500
      cx_mm: 400
      cy_mm: 400
      d_x_mm: 500
      d_y_mm: 500
      As_x_mm2: 2800
      As_y_mm2: 2800
      reaction_height_mm: 0
      fc_MPa: 28
      fy_MPa: 420
    expected:
      status: PASS
      values:
        Lp_x_mm: {value: 1050, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        Mu_x_kNm: {value: 374.85, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        Mu_y_kNm: {value: 374.85, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        beta1_ratio: {value: 0.85, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        a_x_mm: {value: 19.764706, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        c_x_mm: {value: 23.252595, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        eps_t_x_ratio: {value: 0.061509, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        Mn_x_kNm: {value: 576.378353, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        phiMn_x_kNm: {value: 518.740518, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        phiMn_y_kNm: {value: 518.740518, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        ratio: {value: 0.722616, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        ratio_2: {value: 0.722616, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  - id: HC-2
    kind: hand_check
    source: {derivation: "clause spec §4 step 3 with moment: common inputs of §8 with MY = 200 kN.m"}
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, MY_kNm: 200}
    expected:
      status: PASS
      values:
        Mu_x_kNm: {value: 451.0548, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        demand: {value: 451.0548, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        ratio: {value: 0.869519, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        Mu_y_kNm: {value: 374.85, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        ratio_2: {value: 0.722616, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  - id: HC-3
    kind: hand_check
    source: {derivation: "clause spec §4 step 4 middle row: common inputs of §8 with fc = 40 MPa"}
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, fc_MPa: 40}
    expected:
      status: PASS
      values:
        beta1_ratio: {value: 0.764286, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        a_x_mm: {value: 13.835294, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        # c = a / beta1 = 13.835294 / 0.764286 = 18.102253 mm; eps_t = 0.003 (500 - c) / c = 0.079863 (§4 steps 5, 6)
        c_x_mm: {value: 18.102253, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        eps_t_x_ratio: {value: 0.079863, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        Mn_x_kNm: {value: 579.864847, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        phiMn_x_kNm: {value: 521.878362, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        ratio: {value: 0.718271, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  - id: BD-1.a
    kind: boundary
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, fc_MPa: 28}
    expected:
      status: PASS
      values:
        beta1_ratio: {value: 0.85, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  - id: BD-1.b
    kind: boundary
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, fc_MPa: 55}
    expected:
      status: PASS
      values:
        beta1_ratio: {value: 0.65, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  - id: BD-2
    kind: boundary
    covers: [G-2]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, As_x_mm2: 40000, As_y_mm2: 40000}
    expected:
      status: NEEDS_ENGINEER
      values:
        c_x_mm: {value: 332.179931, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        eps_t_x_ratio: {value: 0.001516, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  # BD-2.b: clause spec §4 step 6 at eps_t = eps_tc: c = 0.003 d / 0.008 = 187.5 mm, a = 0.85 c = 159.375 mm,
  # As = a 0.85 fc Ly / fy = 22578.125 mm2 (exact); Mn = As fy (d - a/2) = 3985.744629, phiMn = 3587.170166 kN.m.
  - id: BD-2.b
    kind: boundary
    covers: [G-2]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, As_x_mm2: 22578.125, As_y_mm2: 22578.125}
    expected:
      status: PASS
      values:
        c_x_mm: {value: 187.5, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        eps_t_x_ratio: {value: 0.005, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        eps_t_y_ratio: {value: 0.005, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        phiMn_x_kNm: {value: 3587.170166, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
  - id: BD-2.c
    kind: boundary
    covers: [G-2]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, As_x_mm2: 22650}
    expected:
      status: NEEDS_ENGINEER
      values:
        eps_t_x_ratio: {value: 0.004975, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  - id: BD-2.d
    kind: boundary
    covers: [G-2]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, As_y_mm2: 40000}
    expected:
      status: NEEDS_ENGINEER
      values:
        phiMn_x_kNm: {value: 518.740518, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        c_y_mm: {value: 332.179931, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        eps_t_y_ratio: {value: 0.001516, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  # BD-2.e: d_x != d_y. With As = 22578.125 mm2 and d_y = 450 mm, c = 187.5 mm both ways; eps_t_x = 0.005 passes,
  # eps_t_y = 0.003 (450 - 187.5) / 187.5 = 0.0042 < eps_tc raises G-2 in Y from its own depth (§4 step 6).
  - id: BD-2.e
    kind: boundary
    covers: [G-2]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, As_x_mm2: 22578.125, As_y_mm2: 22578.125, d_y_mm: 450}
    expected:
      status: NEEDS_ENGINEER
      values:
        eps_t_x_ratio: {value: 0.005, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        phiMn_x_kNm: {value: 3587.170166, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        c_y_mm: {value: 187.5, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        eps_t_y_ratio: {value: 0.0042, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  # BD-2.f: upper beta1 row. fc = 55 (beta1 = 0.65), d_x = 600 mm, As = 38958.33 mm2 both ways:
  # a = As fy / (0.85 fc Ly) = 139.999988 mm, c = a / 0.65 = 215.384597 mm; eps_t_x = 0.003 (600 - c) / c = 0.005357
  # passes; eps_t_y = 0.003 (500 - c) / c = 0.003964 < eps_tc raises G-2 (with c = a / 0.85 it would wrongly pass).
  - id: BD-2.f
    kind: boundary
    covers: [G-2]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, fc_MPa: 55, d_x_mm: 600, As_x_mm2: 38958.33, As_y_mm2: 38958.33}
    expected:
      status: NEEDS_ENGINEER
      values:
        beta1_ratio: {value: 0.65, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        c_x_mm: {value: 215.384597, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        eps_t_x_ratio: {value: 0.005357, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        phiMn_x_kNm: {value: 7804.91192, unit: kN.m, abs_tol: 0.001, rel_tol: 0}
        c_y_mm: {value: 215.384597, unit: mm, abs_tol: 1.0e-4, rel_tol: 0}
        eps_t_y_ratio: {value: 0.003964, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  - id: BD-3.a
    kind: boundary
    covers: [FY_MAX]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, fy_MPa: 550}
    expected: {status: PASS}
  - id: BD-3.b
    kind: boundary
    covers: [FY_MAX]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, fy_MPa: 600}
    expected: {status: NEEDS_ENGINEER}
  - id: BD-3.c
    kind: boundary
    covers: [FC_MIN]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, fc_MPa: 16}
    expected: {status: NEEDS_ENGINEER}
  - id: BD-4.a
    kind: boundary
    covers: [COMPRESSION]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, FZ_kN: 0}
    expected: {status: NEEDS_ENGINEER}
  - id: BD-4.b
    kind: boundary
    covers: [FULL_CONTACT, G-1]
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, FZ_kN: 100, MY_kNm: 200}
    expected: {status: NEEDS_ENGINEER}
  - id: PC-1
    kind: program_comparison
    source:
      program: SAFE
      program_version: "recorded at the local test"
      status: needs_local_test
    subject: {kind: footing, id: F1}
    inputs: {<<: *common, MY_kNm: 200}
    expected: {status: PASS}
review: null
