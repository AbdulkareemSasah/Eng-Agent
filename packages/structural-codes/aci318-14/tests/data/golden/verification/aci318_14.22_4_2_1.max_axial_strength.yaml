    inputs: {<<: *common, transverse_kind: spiral}
    expected:
      status: PASS
      values:
        Pn_max_kN: {value: 6404.58, unit: kN, abs_tol: 0.001, rel_tol: 0}
        phi_ratio: {value: 0.75, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
        phiPn_max_kN: {value: 4803.435, unit: kN, abs_tol: 0.001, rel_tol: 0}
        ratio: {value: 0.624553, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
  - id: HC-3
    kind: hand_check
    source: {derivation: "clause spec §4, failing demand, common inputs with Pu = 4000 kN"}
    subject: {kind: frame, id: C1}
    inputs: {<<: *common, Pu_kN: 4000}
    expected:
      status: FAIL
      values:
        ratio: {value: 1.020904, unit: "1", abs_tol: 1.0e-6, rel_tol: 0}
