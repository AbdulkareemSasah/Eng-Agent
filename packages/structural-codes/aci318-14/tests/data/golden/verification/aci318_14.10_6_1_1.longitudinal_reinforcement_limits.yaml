# Case file of aci318_14.10_6_1_1.longitudinal_reinforcement_limits (clause spec §8; plan 0004 T4). Protected test oracle.
# Hand checks repeat the spec's own equations (§4) and are not independent evidence. Tolerances are the spec's §8
# absolute ones (1e-6 mm2 on areas, 1e-9 on ratios), with rel_tol 0 so that the absolute tolerance alone applies.
format: structural-codes-verification/1
check_id: aci318_14.10_6_1_1.longitudinal_reinforcement_limits
cases:
  - id: HC-1
    kind: hand_check
    source: {derivation: "clause spec §4, Ag = 250000 mm2, Ast = 4000 mm2"}
    subject: {kind: frame, id: C1}
    inputs: &common
      Ag_mm2: 250000
      Ast_mm2: 4000
    expected:
      status: PASS
      values:
        As_min_mm2: {value: 2500, unit: mm2, abs_tol: 1.0e-6, rel_tol: 0}
        As_max_mm2: {value: 20000, unit: mm2, abs_tol: 1.0e-6, rel_tol: 0}
        rho_ratio: {value: 0.016, unit: "1", abs_tol: 1.0e-9, rel_tol: 0}
        ratio: {value: 0.625, unit: "1", abs_tol: 1.0e-9, rel_tol: 0}
        ratio_2: {value: 0.2, unit: "1", abs_tol: 1.0e-9, rel_tol: 0}
  - id: BD-1.a
    kind: boundary
    subject: {kind: frame, id: C1}
    inputs: {<<: *common, Ast_mm2: 2500}
    expected:
      status: PASS
      values:
        ratio: {value: 1.0, unit: "1", abs_tol: 1.0e-9, rel_tol: 0}
  - id: BD-1.b
    kind: boundary
    subject: {kind: frame, id: C1}
    inputs: {<<: *common, Ast_mm2: 2499}
    expected:
      status: FAIL
      values:
        ratio: {value: 1.000400160064, unit: "1", abs_tol: 1.0e-9, rel_tol: 0}
  - id: BD-2.a
    kind: boundary
    subject: {kind: frame, id: C1}
    inputs: {<<: *common, Ast_mm2: 20000}
    expected:
      status: PASS
      values:
        ratio_2: {value: 1.0, unit: "1", abs_tol: 1.0e-9, rel_tol: 0}
  - id: BD-2.b
    kind: boundary
    subject: {kind: frame, id: C1}
    inputs: {<<: *common, Ast_mm2: 20001}
    expected:
      status: FAIL
      values:
        ratio_2: {value: 1.00005, unit: "1", abs_tol: 1.0e-9, rel_tol: 0}
  - id: BD-G1
    kind: boundary
    covers: [G-1]
    subject: {kind: frame, id: C1}
    inputs: *common
    expected:
      status: PASS
      values:
        As_min_mm2: {value: 2500, unit: mm2, abs_tol: 1.0e-6, rel_tol: 0}
  - id: BD-3
    kind: boundary
    covers: [STEEL_IN_SECTION]
    subject: {kind: frame, id: C1}
    inputs: {Ag_mm2: 250000, Ast_mm2: 250000}
    expected: {status: NEEDS_ENGINEER}
  - id: PC-1
    kind: program_comparison
    source:
      program: ETABS
      program_version: "recorded at the local test"
      status: needs_local_test
    subject: {kind: frame, id: C1}
    inputs: *common
    expected: {status: PASS}
review: null
