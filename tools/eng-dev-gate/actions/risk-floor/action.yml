name: risk-floor
description: Fail when the risk floor of the changed paths is above the recorded risk (spec 4.6).
inputs:
  gate-root:
    description: Checkout of the base commit that holds the gate; empty for a head run.
    default: ""
runs:
  using: composite
  steps:
    - name: Risk floor
      shell: bash
      env:
        GATE_ROOT: ${{ inputs.gate-root }}
      run: |
        if [ -n "$GATE_ROOT" ]; then
          uv run --project "$GATE_ROOT" --package eng-dev-gate eng-gate --root . --gate-root "$GATE_ROOT" risk-floor
        else
          uv run eng-gate risk-floor
        fi
