name: security
description: Scan for secrets and audit the locked dependencies (spec 4.11, 4.14, AC62).
inputs:
  gate-root:
    description: Checkout of the base commit that holds the gate; empty for a head run.
    default: ""
runs:
  using: composite
  steps:
    - name: Secret scan
      shell: bash
      env:
        GATE_ROOT: ${{ inputs.gate-root }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          scan=(secrets --range "$BASE_SHA..HEAD")
        else
          scan=(secrets --tree)
        fi
        if [ -n "$GATE_ROOT" ]; then
          uv run --project "$GATE_ROOT" --package eng-dev-gate eng-gate --root . --gate-root "$GATE_ROOT" "${scan[@]}"
        else
          uv run eng-gate "${scan[@]}"
        fi
    - name: Dependency audit
      shell: bash
      run: uv audit --locked
