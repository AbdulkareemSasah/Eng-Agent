name: gate-check
description: Check the pull request against the plan gates, the lane, the base branch and CODEOWNERS (spec 4.5).
inputs:
  gate-root:
    description: Checkout of the base commit that holds the gate; empty for a head run.
    default: ""
runs:
  using: composite
  steps:
    - name: Gate check
      shell: bash
      env:
        GATE_ROOT: ${{ inputs.gate-root }}
      run: |
        if [ -n "$GATE_ROOT" ]; then
          uv run --project "$GATE_ROOT" --package eng-dev-gate eng-gate --root . --gate-root "$GATE_ROOT" gate-check
        else
          uv run eng-gate gate-check
        fi
