name: ci-review
description: Verify the pinned reviewer prompts and report the CI reviewer state (spec 4.15, AC61).
inputs:
  gate-root:
    description: Checkout of the base commit that holds the gate; empty for a head run.
    default: ""
runs:
  using: composite
  steps:
    - name: CI review
      shell: bash
      env:
        GATE_ROOT: ${{ inputs.gate-root }}
      run: |
        if [ -n "$GATE_ROOT" ]; then
          uv run --project "$GATE_ROOT" --package eng-dev-gate eng-gate --root . --gate-root "$GATE_ROOT" review
        else
          uv run eng-gate review
        fi
