name: build
description: Build every workspace member with uv build (spec 4.14, AC62).
inputs:
  gate-root:
    description: Checkout of the base commit that holds the gate; empty for a head run.
    default: ""
runs:
  using: composite
  steps:
    - name: Build every member
      shell: bash
      env:
        GATE_ROOT: ${{ inputs.gate-root }}
      run: |
        if [ -n "$GATE_ROOT" ]; then
          names=$(uv run --project "$GATE_ROOT" --package eng-dev-gate eng-gate --root . --gate-root "$GATE_ROOT" packages --names)
        else
          names=$(uv run eng-gate packages --names)
        fi
        [ -n "$names" ] || { echo "::error::no workspace member to build"; exit 1; }
        while IFS= read -r name; do
          uv build --package "$name"
        done <<< "$names"
